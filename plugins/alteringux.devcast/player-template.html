<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__ — devcast</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2024; --dim: #5b636c;
    --line: #e2e5e9; --accent: #2f6feb; --add: #1a7f37; --del: #cf222e;
    --chip: #eef1f5; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    --mono: ui-monospace, "JetBrainsMono Nerd Font", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --dim: #98a1ac;
      --line: #262c35; --accent: #6aa1ff; --add: #3fb950; --del: #f85149;
      --chip: #212832; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --dim: #98a1ac;
    --line: #262c35; --accent: #6aa1ff; --add: #3fb950; --del: #f85149;
    --chip: #212832; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .top h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .1px; }
  .top .meta { font-size: 12px; color: var(--dim); }
  .top .spacer { flex: 1; }
  .top .count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); }
  .wrap { flex: 1; display: flex; min-height: 0; }
  .rail {
    flex: 0 0 264px; border-right: 1px solid var(--line); overflow-y: auto;
    background: var(--panel); padding: 8px;
  }
  .rail.hidden { display: none; }
  .rail .r {
    display: flex; gap: 8px; align-items: baseline; padding: 7px 9px; border-radius: 8px;
    cursor: pointer; font-size: 12px; color: var(--dim); line-height: 1.35;
  }
  .rail .r:hover { background: var(--chip); }
  .rail .r.on { background: var(--chip); color: var(--ink); font-weight: 600; }
  .rail .r .ic { flex: 0 0 auto; width: 16px; text-align: center; }
  .rail .r .lb { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .r .tm { flex: 0 0 auto; font-variant-numeric: tabular-nums; opacity: .7; }
  .stage {
    flex: 1; overflow: hidden; padding: 26px clamp(18px, 5vw, 64px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .kind {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim);
    font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .kind .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .kind.k-prompt .dot { background: #8957e5; }
  .kind.k-tool .dot { background: var(--accent); }
  .kind.k-narration .dot { background: var(--add); }
  .kind.k-thinking .dot { background: var(--dim); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
    min-height: 0; flex: 1;
  }
  .card .hd {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .card .hd .tool { font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .card .hd .ttl { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .hd .note {
    margin-left: auto; font-size: 11px; color: var(--dim); background: var(--chip);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .card .bd { flex: 1; overflow: auto; padding: 14px 16px; }
  .prose { font-size: 15.5px; line-height: 1.62; white-space: pre-wrap; word-break: break-word; }
  .prose.big { font-size: 17px; }
  pre.code {
    margin: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    white-space: pre; tab-size: 2;
  }
  pre.code .a { color: var(--add); }
  pre.code .d { color: var(--del); }
  pre.code .h { color: var(--dim); }
  pre.code .k { color: var(--accent); font-weight: 600; }
  pre.code .s { color: var(--add); }
  pre.code .c { color: var(--dim); font-style: italic; }
  .result {
    flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--chip);
    max-height: 34%; overflow: auto; padding: 10px 16px;
  }
  .result .rl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim); font-weight: 700; margin-bottom: 5px; }
  .result.err .rl { color: var(--del); }
  .result pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .transport {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    padding: 10px 18px; border-top: 1px solid var(--line); background: var(--panel);
  }
  .transport.hidden { display: none; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-size: 14px; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.play { width: 40px; font-size: 16px; }
  .scrub {
    flex: 1; height: 8px; border-radius: 999px; background: var(--chip); position: relative; cursor: pointer;
  }
  .scrub .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; width: 0%; }
  .scrub .ticks { position: absolute; inset: 0; }
  .scrub .tick { position: absolute; top: -2px; width: 2px; height: 12px; background: var(--line); border-radius: 2px; }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .speed {
    appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-size: 12px; border-radius: 8px; padding: 6px 8px; cursor: pointer;
  }
  .badge-redact {
    font-size: 11px; color: var(--dim); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 9px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="top">
    <h1 id="title">devcast</h1>
    <span class="meta" id="submeta"></span>
    <span class="spacer"></span>
    <span class="badge-redact" id="redactBadge" hidden></span>
    <span class="count" id="count"></span>
  </div>
  <div class="wrap">
    <div class="rail" id="rail"></div>
    <div class="stage">
      <div class="kind" id="kind"><span class="dot"></span><span id="kindLabel"></span><span id="kindClock" style="margin-left:auto;font-weight:600;letter-spacing:0"></span></div>
      <div class="card">
        <div class="hd" id="cardHd" hidden>
          <span class="tool" id="cardTool"></span>
          <span class="ttl" id="cardTtl"></span>
          <span class="note" id="cardNote" hidden></span>
        </div>
        <div class="bd" id="cardBd"></div>
        <div class="result" id="cardRes" hidden>
          <div class="rl" id="cardResLabel">output</div>
          <pre id="cardResPre"></pre>
        </div>
      </div>
    </div>
  </div>
  <div class="transport" id="transport">
    <button class="btn" id="prev" title="Previous step (←)">⏮</button>
    <button class="btn play" id="play" title="Play / pause (Space)">▶</button>
    <button class="btn" id="next" title="Next step (→)">⏭</button>
    <div class="scrub" id="scrub"><div class="ticks" id="ticks"></div><div class="fill" id="fill"></div></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <select class="speed" id="speed" title="Speed (↑/↓)">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
      <option value="3">3×</option>
      <option value="4">4×</option>
    </select>
  </div>

<script id="cast" type="application/json">__CAST__</script>
<script>
(function () {
  "use strict";
  var CAST;
  try { CAST = JSON.parse(document.getElementById("cast").textContent); }
  catch (e) { document.body.innerHTML = "<p style='padding:24px'>Bad cast data.</p>"; return; }

  var steps = CAST.steps || [];
  var meta = CAST.meta || {};
  var stats = CAST.stats || {};
  var total = stats.playDurationMs || (steps.length ? steps[steps.length - 1].playT + 2500 : 1000);

  var params = new URLSearchParams(location.search);
  var frameMs = params.has("frame") ? Math.max(0, +params.get("frame") || 0) : null;
  var chromeHidden = params.get("chrome") === "hidden";
  var themeParam = params.get("theme");
  if (themeParam === "dark" || themeParam === "light") document.documentElement.setAttribute("data-theme", themeParam);

  var $ = function (id) { return document.getElementById(id); };

  // ---- header
  $("title").textContent = meta.title || "devcast";
  document.title = (meta.title || "devcast") + " — devcast";
  var sub = [];
  if (meta.project) sub.push(meta.project.replace(/^\/home\/[^/]+/, "~"));
  if (meta.gitBranch) sub.push("⎇ " + meta.gitBranch);
  $("submeta").textContent = sub.join("   ");
  if (stats.redactions) {
    var rb = $("redactBadge"); rb.hidden = false;
    rb.textContent = stats.redactions + " secret" + (stats.redactions === 1 ? "" : "s") + " redacted";
  }

  // ---- rail
  var ICON = { prompt: "▸", narration: "✎", thinking: "…", tool: "⚙" };
  var rail = $("rail");
  steps.forEach(function (s, i) {
    var r = document.createElement("div");
    r.className = "r"; r.dataset.i = i;
    var label = s.kind === "tool" ? (s.tool + (s.title ? " · " + s.title : "")) :
                s.kind === "prompt" ? "prompt" :
                s.kind === "thinking" ? "thinking" : "note";
    r.innerHTML = '<span class="ic">' + (ICON[s.kind] || "•") + '</span>' +
                  '<span class="lb"></span><span class="tm">' + fmt(s.playT) + '</span>';
    r.querySelector(".lb").textContent = label;
    r.addEventListener("click", function () { seekToStep(i); pause(); });
    rail.appendChild(r);
  });
  if (chromeHidden) { rail.classList.add("hidden"); $("transport").classList.add("hidden"); }

  // ---- ticks on the scrub bar (one per step)
  var ticks = $("ticks");
  steps.forEach(function (s) {
    var t = document.createElement("div");
    t.className = "tick"; t.style.left = (100 * s.playT / total) + "%";
    ticks.appendChild(t);
  });

  // ---- tiny highlighter
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function highlight(code, lang) {
    var out = esc(code);
    if (lang === "diff") {
      out = out.split("\n").map(function (l) {
        if (l[0] === "+") return '<span class="a">' + l + "</span>";
        if (l[0] === "-") return '<span class="d">' + l + "</span>";
        if (l.slice(0, 2) === "@@") return '<span class="h">' + l + "</span>";
        return l;
      }).join("\n");
    } else if (lang === "bash") {
      out = out
        .replace(/(^|\n)(#.*)/g, '$1<span class="c">$2</span>')
        .replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="s">$1</span>')
        .replace(/\b(sudo|cd|mkdir|rm|cp|mv|echo|cat|grep|awk|sed|jq|node|npm|git|systemctl|omarchy(?:-[a-z]+)?|chmod|curl|for|do|done|if|then|fi|while)\b/g, '<span class="k">$1</span>');
    } else if (lang === "javascript" || lang === "json" || lang === "typescript" || lang === "qml") {
      out = out
        .replace(/(\/\/.*)/g, '<span class="c">$1</span>')
        .replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="s">$1</span>')
        .replace(/\b(function|return|const|let|var|if|else|for|while|new|typeof|import|export|property|readonly|true|false|null|undefined)\b/g, '<span class="k">$1</span>');
    }
    return out;
  }

  // ---- render one step
  var curIdx = -1;
  function renderStep(i, revealFrac) {
    var s = steps[i];
    if (!s) return;
    curIdx = i;
    $("count").textContent = "step " + (i + 1) + " / " + steps.length;
    Array.prototype.forEach.call(rail.children, function (r, ri) { r.classList.toggle("on", ri === i); });
    var onRail = rail.children[i];
    if (onRail && !chromeHidden) onRail.scrollIntoView({ block: "nearest" });

    $("kind").className = "kind k-" + s.kind;
    $("kindLabel").textContent = s.kind === "tool" ? "tool call" : s.kind;
    $("kindClock").textContent = "T+" + fmt(s.t || 0);

    var hd = $("cardHd");
    if (s.kind === "tool") {
      hd.hidden = false;
      $("cardTool").textContent = s.tool || "";
      $("cardTtl").textContent = s.title || "";
      var note = $("cardNote");
      if (s.note) { note.hidden = false; note.textContent = s.note; } else note.hidden = true;
    } else {
      hd.hidden = true;
    }

    var bd = $("cardBd");
    var reveal = revealFrac == null ? 1 : Math.max(0, Math.min(1, revealFrac));
    if (s.kind === "prompt" || s.kind === "narration" || s.kind === "thinking") {
      var full = s.text || "";
      var shown = reveal >= 1 ? full : full.slice(0, Math.ceil(full.length * reveal));
      bd.innerHTML = '<div class="prose' + (s.kind === "prompt" ? " big" : "") + '"></div>';
      bd.firstChild.textContent = shown;
    } else {
      var body = s.body || "";
      var shownB = reveal >= 1 ? body : body.slice(0, Math.ceil(body.length * reveal));
      bd.innerHTML = '<pre class="code">' + highlight(shownB, s.lang || "text") + "</pre>";
    }

    var res = $("cardRes");
    if (s.result && (s.result.output || s.result.isError)) {
      res.hidden = false;
      res.className = "result" + (s.result.isError ? " err" : "");
      $("cardResLabel").textContent = s.result.isError ? "error" : "output";
      var o = s.result.output || "";
      if (s.result.truncatedLines) o += "\n… +" + s.result.truncatedLines + " more lines";
      $("cardResPre").textContent = o;
    } else {
      res.hidden = true;
    }
  }

  // ---- playback
  var clock = 0, playing = false, rafId = null, lastFrame = 0;
  var speed = 1;

  function stepIndexAt(t) {
    var idx = 0;
    for (var i = 0; i < steps.length; i++) { if (steps[i].playT <= t) idx = i; else break; }
    return idx;
  }
  function revealAt(i, t) {
    var s = steps[i]; if (!s) return 1;
    var next = steps[i + 1];
    var start = s.playT;
    var span = next ? Math.max(200, next.playT - start) : (s.dwell || 1500);
    return (t - start) / span;
  }

  function paint() {
    var i = stepIndexAt(clock);
    renderStep(i, revealAt(i, clock));
    $("fill").style.width = (100 * Math.min(clock, total) / total) + "%";
    $("time").textContent = fmt(clock) + " / " + fmt(total);
  }

  function tick(now) {
    if (!playing) return;
    var dt = now - lastFrame; lastFrame = now;
    clock += dt * speed;
    if (clock >= total) { clock = total; playing = false; $("play").textContent = "↻"; paint(); return; }
    paint();
    rafId = requestAnimationFrame(tick);
  }
  function play() {
    if (playing) return;
    if (clock >= total) clock = 0;
    playing = true; $("play").textContent = "⏸";
    lastFrame = performance.now();
    rafId = requestAnimationFrame(tick);
  }
  function pause() {
    playing = false; $("play").textContent = clock >= total ? "↻" : "▶";
    if (rafId) cancelAnimationFrame(rafId);
  }
  function toggle() { playing ? pause() : play(); }
  function seekToStep(i) {
    i = Math.max(0, Math.min(steps.length - 1, i));
    clock = steps[i].playT + 1;
    paint();
  }
  function seekFrac(f) { clock = Math.max(0, Math.min(1, f)) * total; paint(); }

  // ---- controls
  $("play").addEventListener("click", toggle);
  $("prev").addEventListener("click", function () { pause(); seekToStep(curIdx - 1); });
  $("next").addEventListener("click", function () { pause(); seekToStep(curIdx + 1); });
  $("speed").addEventListener("change", function () { speed = +this.value || 1; });
  $("scrub").addEventListener("click", function (e) {
    var r = this.getBoundingClientRect();
    seekFrac((e.clientX - r.left) / r.width); pause();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === " ") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowRight") { pause(); seekToStep(curIdx + 1); }
    else if (e.key === "ArrowLeft") { pause(); seekToStep(curIdx - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); bumpSpeed(1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); bumpSpeed(-1); }
    else if (e.key.toLowerCase() === "s") { rail.classList.toggle("hidden"); }
    else if (e.key === "Home") { pause(); clock = 0; paint(); }
    else if (e.key === "End") { pause(); clock = total; paint(); }
    else if (e.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });
  function bumpSpeed(d) {
    var opts = [0.5, 1, 1.5, 2, 3, 4];
    var i = opts.indexOf(speed); if (i < 0) i = 1;
    i = Math.max(0, Math.min(opts.length - 1, i + d));
    speed = opts[i]; $("speed").value = String(speed);
  }

  function fmt(ms) {
    var s = Math.round((ms || 0) / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  // ---- export hook: headless renderer calls this per frame, then screenshots
  window.__devcastSeek = function (ms) {
    playing = false;
    clock = Math.max(0, Math.min(+ms || 0, total));
    paint();
  };
  window.__devcastMeta = { total: total, steps: steps.length };

  // ---- boot: export frame mode vs interactive
  if (frameMs != null) {
    clock = Math.min(frameMs, total);
    paint();
  } else {
    paint();
    if (params.get("autoplay") === "1") play();
  }
})();
</script>
</body>
</html>
